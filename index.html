<!DOCTYPE html>
<html lang="en">

<title>Jessica Watson-Galbraith — Handmade Portfolio</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #1a1a1a;
    --order: ["welcome", "about", "timeline", "favdance", "nice", "karaoke", "dirtydancing", "dreamlover", "whiskas"];
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }

  /* page is an A4-proportion canvas centered on white */
  .page { position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; }
  .page.active { display: flex; }
  .canvas { position: relative; width: min(94vw, 70vh * 0.707 * 1.4);
    aspect-ratio: 1 / 1.414; max-height: 92vh; }
  /* canvas uses A4 ratio; pieces positioned by % */
  .piece { position: absolute; height: auto;
    mix-blend-mode: multiply; pointer-events: none;
    transform-origin: center; }
  .piece-link { position: absolute; display: block;
    transform-origin: center; cursor: pointer; mix-blend-mode: multiply;
    transition: transform .15s; }
  .piece-link:hover { filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
  .piece-link img { display: block; height: auto; }

  /* ---- nav: hamburger + overlay ---- */
  .ham { position: fixed; top: 22px; left: 22px; z-index: 50;
    width: 44px; height: 38px; cursor: pointer; background: none; border: 0; }
  .ham img { width: 100%; height: 100%; object-fit: contain; }
  .nav-overlay { position: fixed; inset: 0; background: rgba(255,255,255,.97);
    z-index: 40; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 40px; }
  .nav-overlay.open { display: flex; }
  .nav-group { text-align: center; }
  .nav-group h3 { font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
    color: #999; margin-bottom: 14px; font-weight: normal; }
  .nav-link { display: block; margin: 8px auto; background: none; border: 0;
    font-family: Georgia, serif; font-size: 26px; color: var(--ink);
    cursor: pointer; transition: transform .15s; }
  .nav-link:hover { transform: scale(1.06) rotate(-1deg); }
  .nav-close { position: fixed; top: 22px; right: 28px; font-size: 34px;
    background: none; border: 0; cursor: pointer; color: var(--ink); z-index: 41; }

  /* ---- arrows ---- */
  .arrow { position: fixed; top: 50%; transform: translateY(-50%);
    z-index: 30; width: 54px; height: 46px; cursor: pointer;
    background: none; border: 0; opacity: .8; }
  .arrow:hover { opacity: 1; }
  .arrow img { width: 100%; height: 100%; object-fit: contain; }
  .arrow.left { left: 18px; }
  .arrow.right { right: 18px; }

  /* ---- footer ---- */
  .footer { position: fixed; bottom: 14px; left: 50%;
    transform: translateX(-50%); z-index: 20; height: 26px; opacity: .7; }
  .footer img { height: 100%; width: auto; }

  /* ---- timeline: draggable horizontal strip ---- */
  .tl-scroll { position: relative; width: 100%; height: 100vh;
    overflow-x: auto; overflow-y: auto; cursor: grab;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .tl-scroll.grabbing { cursor: grabbing; }
  .tl-track { position: relative; height: 84vh; min-height: 84vh;
    display: flex; align-items: flex-end; gap: 28px;
    padding: 8vh 80px 4vh 80px; width: max-content; }
  .tl-stop { height: 70vh; width: auto; mix-blend-mode: multiply;
    flex: 0 0 auto; }

  @media (max-width: 760px) {
    .canvas { width: 96vw; }
    .nav-link { font-size: 21px; }
  }

  /* ---- karaoke page: handwriting left, video grid right ---- */
  #karaoke { overflow-y: auto; align-items: flex-start; }
  .kk-wrap { display: flex; gap: 2vw; width: 94vw; max-width: 1500px;
    margin: 0 auto; padding: 7vh 0 8vh; align-items: flex-start; }
  .kk-left { flex: 0 0 28%; position: relative; }
  .kk-piece { display: block; width: 100%; height: auto;
    mix-blend-mode: multiply; margin-bottom: 18px; }
  .kk-deadant { width: 60%; margin-top: 10px; }
  .kk-grid { flex: 1; display: grid;
    grid-template-columns: repeat(3, 1fr); gap: 14px; align-content: start; }
  .kv-cell { position: relative; aspect-ratio: 4 / 3;
    background: #0a0a0a; overflow: hidden; }
  .kv-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .kv-play { position: absolute; inset: 0; margin: auto; width: 54px; height: 54px;
    border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff;
    font-size: 20px; cursor: pointer; opacity: .85;
    display: flex; align-items: center; justify-content: center; }
  .kv-cell.playing .kv-play { opacity: 0; }
  .kv-cell:hover .kv-play { opacity: 1; }
  @media (max-width: 900px) {
    .kk-wrap { flex-direction: column; }
    .kk-left { flex: none; width: 70%; }
    .kk-grid { grid-template-columns: repeat(2, 1fr); width: 100%; }
  }
  @media (max-width: 540px) {
    .kk-grid { grid-template-columns: 1fr; }
  }

  /* ---- dirty dancing page: 3 text columns left, photo album right ---- */
  #dirtydancing { overflow-y: auto; align-items: flex-start; }
  .dd-wrap { display: flex; gap: 3vw; width: 94vw; max-width: 1500px;
    margin: 0 auto; padding: 7vh 0 8vh; align-items: flex-start; }
  .dd-left { flex: 0 0 40%; display: grid;
    grid-template-columns: 1fr 1fr; gap: 20px; align-content: start; }
  .dd-text { width: 100%; height: auto; mix-blend-mode: multiply; }
  .dd-text:first-child { grid-row: span 2; }  /* tall first column */
  .dd-photos { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .dd-row { display: flex; gap: 12px; }
  .dd-row-full .dd-photo { width: 100%; }
  .dd-row-pair .dd-photo { flex: 1; min-width: 0; }
  .dd-photo { height: auto; object-fit: cover; display: block; }
  @media (max-width: 900px) {
    .dd-wrap { flex-direction: column; }
    .dd-left { flex: none; width: 100%; }
    .dd-photos { width: 100%; }
  }

  /* ---- dreamlover page: story left, 2-col photo grid right ---- */
  #dreamlover { overflow-y: auto; align-items: flex-start; }
  .dl-wrap { display: flex; gap: 3vw; width: 94vw; max-width: 1500px;
    margin: 0 auto; padding: 6vh 0 8vh; align-items: flex-start; }
  .dl-left { flex: 0 0 38%; position: relative; }
  .dl-headline { width: 90%; height: auto; mix-blend-mode: multiply; margin-bottom: 24px; }
  .dl-text { width: 100%; height: auto; mix-blend-mode: multiply; }
  .dl-note { width: 36%; height: auto; mix-blend-mode: multiply;
    margin-top: 30px; margin-left: auto; display: block; }
  .dl-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; align-content: start; }
  .dl-photo { width: 100%; height: auto; object-fit: cover; display: block; }
  @media (max-width: 900px) {
    .dl-wrap { flex-direction: column; }
    .dl-left { flex: none; width: 100%; }
    .dl-grid { width: 100%; }
  }
  @media (max-width: 540px) {
    .dl-grid { grid-template-columns: 1fr; }
  }

  /* ---- whiskas case study page: handwriting left, image column right ---- */
  #whiskas { overflow-y: auto; align-items: flex-start; }
  .wk-wrap { display: flex; gap: 4vw; width: 92vw; max-width: 1300px;
    margin: 0 auto; padding: 6vh 0 10vh; align-items: flex-start; }
  .wk-left { flex: 0 0 26%; position: sticky; top: 6vh; align-self: flex-start; }

  .wk-textA { width: 100%; height: auto; mix-blend-mode: multiply; margin-bottom: 28px; }
  .wk-textB { width: 78%; height: auto; mix-blend-mode: multiply; }
  .wk-col { flex: 1; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .wk-item { width: 100%; }
  .wk-item img { width: 100%; height: auto; display: block; }
  .vid-embed { position: relative; padding-top: 56.25%; width: 100%; }
  .vid-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: 0; }
  @media (max-width: 760px) {
    .wk-wrap { flex-direction: column; }
    .wk-left { flex: none; width: 80%; position: static; }
    .wk-col { width: 100%; }
  }

<button class="arrow left" id="prevBtn" aria-label="previous"><img src="arrow-left.png" alt="prev"></button>
<button class="arrow right" id="nextBtn" aria-label="next"><img src="arrow-right.png" alt="next"></button>

<div class="footer"><img src="footer.png" alt=""></div>

<script>
  const ORDER = ["welcome", "about", "timeline", "favdance", "nice", "karaoke", "dirtydancing", "dreamlover", "whiskas"];
  let idx = 0;

  function show(target) {
    const i = (typeof target === 'number') ? target : ORDER.indexOf(target);
    if (i < 0 || i >= ORDER.length) return;
    idx = i;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(ORDER[idx]).classList.add('active');
  }
  function next() { show(Math.min(idx + 1, ORDER.length - 1)); }
  function prev() { show(Math.max(idx - 1, 0)); }

  document.getElementById('nextBtn').onclick = next;
  document.getElementById('prevBtn').onclick = prev;
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  // timeline drag-to-pan
  const tl = document.getElementById('tlScroll');
  if (tl) {
    let down=false, sx=0, sy=0, sl=0, st=0;
    tl.addEventListener('mousedown', e => {
      down=true; tl.classList.add('grabbing');
      sx=e.pageX; sy=e.pageY; sl=tl.scrollLeft; st=tl.scrollTop;
    });
    window.addEventListener('mouseup', () => { down=false; tl.classList.remove('grabbing'); });
    window.addEventListener('mousemove', e => {
      if(!down) return; e.preventDefault();
      tl.scrollLeft = sl - (e.pageX - sx);
      tl.scrollTop  = st - (e.pageY - sy);
    });
  }

  // karaoke grid is now static image stills — no playback JS needed.

  show(0);
</script>
